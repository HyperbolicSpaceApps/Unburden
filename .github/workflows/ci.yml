name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: unburden_app
        run: flutter pub get

      - name: Run unit tests
        working-directory: unburden_app
        run: flutter test

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libblkid-dev liblzma-dev ninja-build cmake

      - name: Run integration tests
        working-directory: unburden_app
        env:
          UNBURDEN_GROQ_API_KEY: ${{ secrets.UNBURDEN_GROQ_API_KEY }}
        run: flutter test integration_test/app_test.dart integration_test/llm_behavior_test.dart -d linux
